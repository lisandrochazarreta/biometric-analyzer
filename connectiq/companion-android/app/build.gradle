plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lis.ghostgap'
    compileSdk 34

    defaultConfig {
        applicationId "com.lis.ghostgap"
        minSdk 26          // TextToSpeech moderno + BLE
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Connect IQ Mobile SDK: NO está en Maven. Descargá el SDK de
    // https://developer.garmin.com/connect-iq/sdk/ y poné connectiq.aar en
    // app/libs/, luego descomentá:
    // implementation files('libs/connectiq.aar')
}
